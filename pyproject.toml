[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindlab-toolkit"
version = "0.2.0"
description = "Mind Lab Toolkit (MinT) - the Open Infrastructure for Experiential Intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Mind Lab" }
]
keywords = ["mindlab", "mint", "tinker", "reinforcement-learning", "lora", "ml", "training"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tinker==0.22.0",
]

[project.optional-dependencies]
glm52-renderer = [
    "tinker-cookbook>=0.4.0,<0.4.2",
]

[project.urls]
Homepage = "https://macaron.im/mindlab"

[tool.hatch.build.targets.wheel]
packages = ["src/mint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring an external reference checkout or network access",
]
